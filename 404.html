<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Page Not Found</title>
    <!-- GitHub Pages serves this file at whatever URL was missing, so relative
         paths only resolve for top-level misses (e.g. /nope, not /a/b). -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="images/the_offline_days_logo.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav">
        <a class="site-nav__brand" href="./">
          <img
            class="site-nav__logo"
            src="images/the_offline_days_logo.svg"
            alt="logo"
            width="56"
            height="56"
          />
          <span>The Offline Days</span>
        </a>
      </nav>
    </header>
    <main>
      <section class="hero">
        <article class="card fade-up">
          <p class="cta__error">Sorry, this page is offline. ✌️</p>
          <a href="./">Let's go home</a>
        </article>
      </section>
    </main>
    <footer>
      <p>&copy; <span id="year">2026</span> The Offline Days</p>
    </footer>
  </body>
</html>
